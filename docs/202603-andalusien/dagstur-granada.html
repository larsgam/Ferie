<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Granada · Dagstur 31. marts 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }

    #header {
      background: #1a1a2e;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 10px;
      flex-wrap: wrap;
    }
    #header h1 { font-size: 15px; font-weight: 600; white-space: nowrap; }
    #header-right { display: flex; align-items: center; gap: 8px; }

    #gps-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    #gps-btn:active { background: #1d4ed8; }

    #map { flex: 1; }

    .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.2); max-width: 280px; }
    .leaflet-popup-content { margin: 13px 15px; }
    .popup-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 10px; color: white; margin-bottom: 6px;
    }
    .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; line-height: 1.3; }
    .popup-time { font-size: 11px; color: #888; margin-bottom: 6px; font-weight: 500; }
    .popup-body { font-size: 12px; color: #333; line-height: 1.6; }
    .popup-tip { margin-top: 7px; font-size: 11px; color: #555; background: #f5f5f7; border-radius: 6px; padding: 5px 8px; }
    .popup-tip b { color: #111; }

    /* Nummererede markør-ikoner */
    .stop-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      border: 2.5px solid rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>

<div id="header">
  <h1>📍 Granada · 31. marts 2026</h1>
  <div id="header-right">
    <button id="gps-btn">📡 Find mig</button>
  </div>
</div>

<div id="map"></div>

<script>
const map = L.map('map').setView([37.177, -3.598], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 19
}).addTo(map);

// ── GPS ──────────────────────────────────────────────────────────────────────
let gpsMarker = null;
document.getElementById('gps-btn').addEventListener('click', () => {
  if (!navigator.geolocation) { alert('Geolocation ikke tilgængeligt'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const latlng = [pos.coords.latitude, pos.coords.longitude];
    if (gpsMarker) gpsMarker.setLatLng(latlng);
    else {
      gpsMarker = L.circleMarker(latlng, {
        radius: 9, fillColor: '#2563eb', color: 'white', weight: 2.5,
        fillOpacity: 1
      }).addTo(map).bindPopup('📡 Du er her');
    }
    map.setView(latlng, 16);
  }, () => alert('Kunne ikke hente position'));
});

// ── Hjælpefunktion: nummereret ikon ─────────────────────────────────────────
function stopIcon(num, color) {
  return L.divIcon({
    className: '',
    html: `<div class="stop-icon" style="background:${color}">${num}</div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -18]
  });
}

// Farver pr. type
const C_SEV   = '#0f766e';   // seværdighed (teal)
const C_KV    = '#7c3aed';   // kvarter (lilla)
const C_MAD   = '#dc2626';   // mad (rød)
const C_KAFFE = '#b45309';   // kaffestop (brun)

// ── STOP A.1 — Albaicín ──────────────────────────────────────────────────────
L.marker([37.1818, -3.5922], { icon: stopIcon('A1', C_SEV) })
  .addTo(map)
  .bindPopup(`
    <div class="popup-badge" style="background:${C_SEV}">Seværdighed</div>
    <div class="popup-title">A.1 · Albaicín + Mirador San Nicolás</div>
    <div class="popup-time">⏰ 10:30 — ca. 60 min</div>
    <div class="popup-body">
      Mørisk kvarter med smalle kalkede gader der snor sig op ad bakken. Gå mod
      <b>Mirador San Nicolás</b> øverst — den bedste udsigt over Alhambra med Sierra Nevada bag.
      Tidligt på dagen er det stille og lokalt.
    </div>
    <div class="popup-tip"><b>Tip:</b> Sæt bilen på Parking San Agustín og gå derfra.</div>
  `);

// ── STOP A.2 — Catedral + Capilla Real ──────────────────────────────────────
L.marker([37.1762, -3.5990], { icon: stopIcon('A2', C_SEV) })
  .addTo(map)
  .bindPopup(`
    <div class="popup-badge" style="background:${C_SEV}">Seværdighed</div>
    <div class="popup-title">A.2 · Catedral + Capilla Real</div>
    <div class="popup-time">⏰ 09:00–13:30 (lukker tidligst!)</div>
    <div class="popup-body">
      Granadas spektakulære renæssancekatedral er fantastisk stor indefra.
      <b>Capilla Real</b> ved siden af er gravsted for Ferdinand og Isabella — de originale kister,
      kronjuveler og Isabella's private kunstsamling. Stærk historisk oplevelse.
    </div>
    <div class="popup-tip"><b>OBS Semana Santa:</b> Lukker kl. 13:30. Besøg inden frokost!</div>
  `);

// ── STOP A.3 — Bañuelo ──────────────────────────────────────────────────────
L.marker([37.1792, -3.5908], { icon: stopIcon('A3', C_SEV) })
  .addTo(map)
  .bindPopup(`
    <div class="popup-badge" style="background:${C_SEV}">Seværdighed</div>
    <div class="popup-title">A.3 · El Bañuelo (arabisk bad)</div>
    <div class="popup-time">⏰ 11:30 — ca. 30 min</div>
    <div class="popup-body">
      Granadas bedst bevarede møriske bad fra 1000-tallet — de originale
      stjerneformede lyshuller i hvælvingerne er intakte. Lille, roligt og
      utroligt velbevaret. Ligger ved Carrera del Darro.
    </div>
    <div class="popup-tip"><b>Tip:</b> Gratis indgang. Aldrig fyldt med turister.</div>
  `);

// ── STOP A.4 — Sacromonte ────────────────────────────────────────────────────
L.marker([37.1830, -3.5848], { icon: stopIcon('A4', C_SEV) })
  .addTo(map)
  .bindPopup(`
    <div class="popup-badge" style="background:${C_SEV}">Seværdighed</div>
    <div class="popup-title">A.4 · Sacromonte</div>
    <div class="popup-time">⏰ 15:00 — ca. 45 min gåtur</div>
    <div class="popup-body">
      Gitano-kvarteret med boliger hugget ind i klippesiden. Gå op ad
      <b>Camino del Sacromonte</b> for udsigt og stemning. Levende flamenco-tradition
      og huleboliger der stadig er beboede.
    </div>
    <div class="popup-tip"><b>Tip:</b> Gå op ad vejen — du behøver ikke betale for museum.</div>
  `);

// ── STOP B.1 — Carrera del Darro + Calderería Nueva ─────────────────────────
L.marker([37.1785, -3.5950], { icon: stopIcon('B1', C_KV) })
  .addTo(map)
  .bindPopup(`
    <div class="popup-badge" style="background:${C_KV}">Kvarter</div>
    <div class="popup-title">B.1 · Carrera del Darro + Calderería Nueva</div>
    <div class="popup-time">⏰ 16:00 — slentr rundt</div>
    <div class="popup-body">
      <b>Carrera del Darro</b> er den smukkeste gade i Granada — langs floden med
      Alhambra ovenfor. <b>Calderería Nueva</b> er den "marokkanske gade" med
      tebutikker, krydderier og håndværk. Unik stemning midt i byen.
    </div>
    <div class="popup-tip"><b>Shopping:</b> Calderería Nueva har masser af souvenirs og te til pigerne.</div>
  `);

// ── FROKOST — Calle Navas ────────────────────────────────────────────────────
L.marker([37.1760, -3.5993], { icon: stopIcon('🍽', C_MAD) })
  .addTo(map)
  .bindPopup(`
    <div class="popup-badge" style="background:${C_MAD}">Frokost</div>
    <div class="popup-title">Frokost · Calle Navas</div>
    <div class="popup-time">⏰ ca. 14:00</div>
    <div class="popup-body">
      Granadas tapas-gade nummer ét. To gode muligheder:<br><br>
      <b>Bodegas Castañeda</b> — klassisk bodega fra 1800-tallet, lokalt favoritsted,
      billige tapas og riojavine fra egetønder.<br><br>
      <b>Bar Los Diamantes</b> — stod i kø for friteret fisk og skaldyr. Stående
      bardisk, aldrig turistmenu.
    </div>
    <div class="popup-tip"><b>Granada-regel:</b> Gratis tapa med hver drink. Bestil vino tinto eller cerveza.</div>
  `);

// ── TAPAS/KAFFE — Placeta San Miguel Bajo ────────────────────────────────────
L.marker([37.1810, -3.5935], { icon: stopIcon('☕', C_KAFFE) })
  .addTo(map)
  .bindPopup(`
    <div class="popup-badge" style="background:${C_KAFFE}">Kaffestop</div>
    <div class="popup-title">Placeta San Miguel Bajo</div>
    <div class="popup-time">⏰ ca. 16:30</div>
    <div class="popup-body">
      Lille ægte lokal plads i Albaicín — terrasser, kaffe og en øl i solen.
      Ingen turistmenuer, ingen engelske skilte. Lokale kommer her.
    </div>
    <div class="popup-tip"><b>Tip:</b> Sæt jer udenfor og nyd udsigten over tage og tårne.</div>
  `);

// ── PARKERING ────────────────────────────────────────────────────────────────
L.marker([37.1770, -3.6010], {
  icon: L.divIcon({
    className: '',
    html: `<div class="stop-icon" style="background:#374151">🅿</div>`,
    iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -18]
  })
})
  .addTo(map)
  .bindPopup(`
    <div class="popup-badge" style="background:#374151">Parkering</div>
    <div class="popup-title">START · Parking San Agustín</div>
    <div class="popup-body">
      Bedste parkering til dette program — tæt på Catedral og gåafstand til alt.
      Parkering betales med app eller automat.
    </div>
  `);

// ── RUTE-POLYLINE ─────────────────────────────────────────────────────────────
// Logisk rækkefølge: Parkering → A2 (Capilla Real, tidligst!) → A1 (Albaicín) →
// A3 (Bañuelo) → Frokost → A4 (Sacromonte) → B1 (Calderería/Darro) → Kaffestop
const route = [
  [37.1770, -3.6010],   // Parkering
  [37.1762, -3.5990],   // A2 Catedral
  [37.1818, -3.5922],   // A1 Albaicín / Mirador
  [37.1792, -3.5908],   // A3 Bañuelo
  [37.1760, -3.5993],   // Frokost Calle Navas
  [37.1830, -3.5848],   // A4 Sacromonte
  [37.1785, -3.5950],   // B1 Carrera del Darro
  [37.1810, -3.5935],   // Kaffestop Placeta San Miguel
];

L.polyline(route, {
  color: '#2563eb',
  weight: 4,
  opacity: 0.7,
  dashArray: '8, 6',
  lineJoin: 'round'
}).addTo(map);

</script>
</body>
</html>
