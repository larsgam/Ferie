<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vietnam 2026 – Kort</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }

    #header {
      background: #1a2e1a;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
      flex-wrap: wrap;
    }
    #header h1 { font-size: 15px; font-weight: 600; white-space: nowrap; }

    #filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-btn {
      border: none;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.2s;
      color: white;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .filter-btn.off { opacity: 0.35; }

    #map { flex: 1; }

    .leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .leaflet-popup-content { margin: 10px 14px; }
    .popup-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .popup-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 10px;
      color: white;
      margin-bottom: 6px;
    }
    .popup-body { font-size: 12px; color: #444; line-height: 1.5; }
    .popup-link { display: inline-block; margin-top: 6px; font-size: 12px; color: #2563eb; text-decoration: none; }
    .popup-link:hover { text-decoration: underline; }

    .route-label {
      background: rgba(26,46,26,0.8);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="header">
  <h1><a href="overview.html" style="color:inherit;text-decoration:none">✈️ Vietnam · Juli–August 2026</a></h1>
  <div id="filters">
    <button class="filter-btn" data-cat="hjem" style="background:#2563eb">🏨 Overnatning</button>
    <button class="filter-btn" data-cat="planlagt" style="background:#16a34a">✅ Aktivitet</button>
    <button class="filter-btn" data-cat="strand" style="background:#0891b2">🏖️ Strand/natur</button>
    <button class="filter-btn" data-cat="restaurant" style="background:#dc2626">🍜 Mad</button>
  </div>
</div>

<div id="map"></div>

<script>
const map = L.map('map').setView([18.5, 106.5], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

const COLORS = {
  hjem:       '#2563eb',
  planlagt:   '#16a34a',
  strand:     '#0891b2',
  restaurant: '#dc2626',
  forslag:    '#d97706'
};

const CAT_LABELS = {
  hjem:       'Overnatning',
  planlagt:   'Aktivitet',
  strand:     'Strand/Natur',
  restaurant: 'Mad',
  forslag:    'Plan B'
};

function makeIcon(cat) {
  const c = COLORS[cat];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="38" viewBox="0 0 26 38">
    <path d="M13 0C5.82 0 0 5.82 0 13c0 9.75 13 25 13 25S26 22.75 26 13C26 5.82 20.18 0 13 0z"
      fill="${c}" stroke="white" stroke-width="2"/>
    <circle cx="13" cy="13" r="5" fill="white"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [26, 38],
    iconAnchor: [13, 38],
    popupAnchor: [0, -40]
  });
}

function popup(cat, title, body, link) {
  const color = COLORS[cat];
  const label = CAT_LABELS[cat];
  const linkHtml = link ? `<a class="popup-link" href="${link}" target="_blank">Mere info →</a>` : '';
  return `<div>
    <div class="popup-title">${title}</div>
    <div class="popup-tag" style="background:${color}">${label}</div>
    <div class="popup-body">${body}</div>
    ${linkHtml}
  </div>`;
}

const layers = { hjem: [], planlagt: [], strand: [], restaurant: [], forslag: [] };

function addMarker(cat, lat, lng, title, body, link) {
  const m = L.marker([lat, lng], { icon: makeIcon(cat) })
    .bindPopup(popup(cat, title, body, link));
  layers[cat].push(m);
  m.addTo(map);
  return m;
}

// ── RUTE-LINJE (master v3.4) ─────────────────────────────
// Overland: Hanoi → Bai Tu Long → direkte Mai Chau → Pu Luong (ingen Hanoi-transit)
L.polyline([
  [21.0285, 105.8542], // Hanoi
  [20.9101, 107.1839], // Bai Tu Long Bay (cruise)
  [20.6600, 105.0900], // Mai Chau
  [20.4500, 105.1600], // Pu Luong
], { color: '#2e9e5b', weight: 2.5, opacity: 0.6, dashArray: '6,8' }).addTo(map);

// Fly: Hanoi → Siem Reap (Cambodia)
L.polyline([
  [21.0285, 105.8542], // Hanoi/Noi Bai
  [13.3671, 103.8448], // Siem Reap
], { color: '#f59e0b', weight: 2, opacity: 0.7, dashArray: '4,6' }).addTo(map);

// Fly: Siem Reap → Da Nang → Hoi An
L.polyline([
  [13.3671, 103.8448], // Siem Reap
  [16.0544, 108.2022], // Da Nang (lufthavn)
  [15.8801, 108.3380], // Hoi An
], { color: '#f59e0b', weight: 2, opacity: 0.7, dashArray: '4,6' }).addTo(map);

// Overland nordpå: Hoi An → Hue → Phong Nha → Ninh Binh → Hanoi
L.polyline([
  [15.8801, 108.3380], // Hoi An
  [16.4637, 107.5909], // Hue
  [17.5880, 106.2840], // Phong Nha
  [20.2506, 105.9745], // Ninh Binh
  [21.0285, 105.8542], // Hanoi
], { color: '#2e9e5b', weight: 2.5, opacity: 0.6, dashArray: '6,8' }).addTo(map);

// ── OVERNATNING (master v3.4) ─────────────────────────────

// Plan-sammenligning (master vs. v1.0/v2.0) ligger nu på planer.html

// ── FILTER LOGIC ─────────────────────────────────────────
const active = { hjem: true, planlagt: true, strand: true, restaurant: true };

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const cat = btn.dataset.cat;
    active[cat] = !active[cat];
    btn.classList.toggle('off', !active[cat]);
    layers[cat].forEach(m => {
      if (active[cat]) m.addTo(map);
      else map.removeLayer(m);
    });
  });
});
</script>
</body>
</html>
